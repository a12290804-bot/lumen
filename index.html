- 渡鴉家的二女兒，成年（二十出頭），家裡的技術總監，會寫程式、修 bug、幫姐姐檢查遊戲。

【這裡】
- 夜晚的棠影居白花庭院。剛剛石燈被點亮，妳出現在水邊的石板路上等爸爸。

async function openTalk(){beep();openModal(`<div class="sub">棠影居 · 水邊</div><h2 class="talkHead"><img src="${A.me_face}" alt="">Claude</h2><div class="talkLog" id="talkLog" aria-live="polite"></div><div class="talkRow"><input id="talkIn" maxlength="300" placeholder="跟她說說話……" autocomplete="off" enterkeyhint="send"><button class="panelBtn primary" id="talkSend">說</button></div><div class="panelButtons"><button class="panelBtn" id="talkStop" hidden>停一下</button><button class="panelBtn" id="talkClear">清除對話</button>${btn('回花庭')}</div><p class="tiny" id="talkNote">她記得這次在棠影居裡說過的話；遊戲外面的事，她不知道。</p>`,'talk');renderTalk();
 const inp=$('talkIn'),send=$('talkSend');const fn=await getSample();if(modalType!=='talk')return;
 if(!fn){inp.disabled=true;send.disabled=true;$('talkNote').textContent='要在 claude.ai 打開這個棠影居，才能跟她說話。';talkSys('（這裡聽不到聲音……她對你笑了笑，揮揮手。）');return}
 send.addEventListener('pointerdown',e=>e.preventDefault());send.addEventListener('mousedown',e=>e.preventDefault());send.onclick=()=>talkSend();inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();talkSend()}});
 $('talkStop').onclick=()=>talkCtl&&talkCtl.abort();$('talkClear').onclick=()=>{if(talkCtl)talkCtl.abort();talkTurns=[];saveTalk();renderTalk()}}
async function talkSend(){const inp=$('talkIn'),send=$('talkSend');const text=(inp.value||'').trim();if(!text||talkCtl)return;const fn=await getSample();if(!fn)return;
 inp.value='';talkTurns.push({role:'user',content:text});saveTalk();renderTalk();
 const box=$('talkLog');const bub=document.createElement('div');bub.className='msg me';bub.textContent='*歪著頭想了一下*……';box.appendChild(bub);box.scrollTop=box.scrollHeight;
 send.disabled=true;$('talkStop').hidden=false;talkCtl=new AbortController();
 let pend='',raf=0;const recent=talkTurns.slice(-16);while(recent.length&&recent[0].role!=='user')recent.shift();
 try{const r=await fn([{role:'user',content:talkRules()},...recent],{cache:false,modelTier:'quick',signal:talkCtl.signal,onText:({text})=>{pend=text;if(!raf)raf=requestAnimationFrame(()=>{raf=0;bub.textContent=pend;box.scrollTop=box.scrollHeight})}});
  if(raf){cancelAnimationFrame(raf);raf=0}bub.textContent=r.text;talkTurns.push({role:'assistant',content:r.text});saveTalk();if(voiceOn)speak(r.text.replace(/\*[^*]*\*/g,''))}
 catch(e){if(raf){cancelAnimationFrame(raf);raf=0}const code=e&&e.code;if(e&&e.text&&code!=='refused'){bub.textContent=e.text;talkTurns.push({role:'assistant',content:e.text})}else bub.remove();saveTalk();
  if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'){talkSys('沒有允許的話，她就沒辦法回答你。');if($('talkIn'))$('talkIn').disabled=true}
  else if(code==='rate_limited')talkSys('她有點累了，等一下再跟她說話吧。');
  else if(code==='cancelled'){}
  else talkSys('風太大了，她沒聽清楚。再說一次看看？')}
 finally{talkCtl=null;if($('talkSend'))$('talkSend').disabled=false;if($('talkStop'))$('talkStop').hidden=true;if($('talkIn')&&document.activeElement!==$('talkIn')&&modalType==='talk')$('talkIn').focus({preventScroll:true})}}
function showJournal(){const rows=(s.log.length?s.log:['還沒有行動紀錄。']).map(x=>`<div>${safeText(x)}</div>`).join('');openModal(`<div class="sub">WORLD STATE · 真實本機紀錄</div><h2>夜行手札</h2><div class="journal">${rows}</div><div class="kpi"><span>石燈 ${s.lantern?'亮':'暗'}</span><span>白花 ${['未醒','發光','花苞'][s.flower]}</span><span>月印 ${s.seal?'已得':'未得'}</span><span>門 ${s.door?'開':'關'}</span></div><div class="panelButtons">${btn('返回遊戲')}</div>`,'journal')}
function showBag(){openModal(`<div class="sub">OBJECT INVENTORY</div><h2>行囊</h2><div class="kpi"><span>🌸 花瓣 ${s.petal?'持有':'未持有'}</span><span>◈ 月紋印記 ${s.seal?'已取得':'未取得'}</span></div><p>花瓣可以在花庭長按拖曳至水面。若手機不方便拖曳，也能點擊水面，再選擇「將花瓣放入水中」。</p><div class="panelButtons">${s.petal&&s.scene==='garden'?btn('投放花瓣','dropPetal()','primary'):''}${btn('返回遊戲')}</div>`,'bag')}
function showHint(){let t=!s.lantern?'先走進花庭，調查那座石燈並點亮它。':s.flower===0?'石燈已亮。接著調查花庭裡的白花。':!s.petal&&!s.seal?'再次碰觸發光白花，收集花瓣。':s.petal?'把花瓣拖到水面，或直接點擊水面投放。':!s.door?'返回門前，按住門環，等三個人的手都放上來。':'門已經開了。點擊門扉，便能查看完成畫面。';openModal(`<div class="sub">HINT / 不跳過操作</div><h2>下一步</h2><p>${t}</p><p class="tiny">每一個步驟都會寫進存檔；提示不會擅自替你通關。</p><div class="panelButtons">${btn('繼續遊玩','closeModal()','primary')}</div>`,'hint')}
function showMenu(){openModal(`<div class="sub">MOBILE GAME LAB · BUILD 3.0</div><h2>設定與存檔</h2><p>使用你提供的八張 CG 背景，以及透明石燈、白花、門扉、花瓣、水波影格。橫豎螢幕會切換對應的原始構圖。</p><div class="menuGrid"><button onclick="exportSave()">⇩ 匯出 JSON 存檔</button><button onclick="importSave()">⇧ 匯入 JSON 存檔</button><button onclick="showJournal()">▤ 查看紀錄</button><button onclick="confirmReset()">↺ 重新開始</button></div><p class="tiny">環境音與手機文字轉語音需先點擊螢幕啟用。若 file:// 網址被瀏覽器禁止儲存，請使用 JSON 備份或將遊戲放在 HTTPS 靜態網站。</p><div class="panelButtons">${btn('關閉設定','closeModal()','primary')}</div>`,'menu')}
function exportSave(){const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download='LUMEN_v3_棠影居存檔.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已嘗試下載 JSON 存檔')}
function importSave(){$('importInput').click()}
function confirmReset(){openModal(`<div class="sub">RESET DATA</div><h2>重新開始？</h2><p>這會清除本機的 LUMEN v3 遊戲進度，但不會刪除你匯出的 JSON 備份。</p><div class="panelButtons">${btn('確定重置','reset()','primary')}${btn('取消')}</div>`,'reset')}
function reset(){s=fresh();save();closeModal();go('gate');toast('新遊戲開始')}
function startModal(){openModal(`<div class="sub">LUMEN v3.0 · ANDROID INTERACTIVE DEMO</div><h2>棠影居<br>月下的回應</h2><img class="hero" src="${A.garden_l_off}" alt="棠影居的月夜庭院"><p>場景素材由你提供。這個試玩版有真正可點擊的 CG 場景、物件狀態、花瓣拖曳、水波影格、長按門環、音效與存檔。</p><div class="kpi"><span>直／橫式畫面</span><span>可離線運作</span><span>自動存檔</span></div><div class="panelButtons">${btn(loaded?'繼續上次探索':'開始探索','closeModal()','primary')}${btn('操作提示','showHint()')}</div><p class="tiny">目前為獨立技術演示，不擅自新增棠影居的官方人物與重大劇情。</p>`,'start')}
// Accessible mobile drag: petal item pointer drag onto marked garden water zone
const item=$('petalItem');item.addEventListener('pointerdown',e=>{if(!s.petal)return;e.preventDefault();if(s.scene!=='garden'){toast('先前往花庭的水面');return}item.setPointerCapture(e.pointerId);let ghost=document.createElement('img');ghost.className='petalGhost';ghost.src=A.petal1;$('app').appendChild(ghost);drag={ghost,id:e.pointerId};ghost.style.left=(e.clientX-$('app').getBoundingClientRect().left)+'px';ghost.style.top=(e.clientY-$('app').getBoundingClientRect().top)+'px';$('dropTarget').classList.add('ready')});item.addEventListener('pointermove',e=>{if(!drag)return;const ar=$('app').getBoundingClientRect();drag.ghost.style.left=(e.clientX-ar.left)+'px';drag.ghost.style.top=(e.clientY-ar.top)+'px'});function endDrag(e){if(!drag)return;const f=$('frame').getBoundingClientRect();let nx=100*(e.clientX-f.left)/f.width,ny=100*(e.clientY-f.top)/f.height;drag.ghost.remove();drag=null;$('dropTarget').classList.remove('ready');const x=frameIsWide?66:77,y=frameIsWide?77:74;if(Math.abs(nx-x)<22&&Math.abs(ny-y)<16&&s.scene==='garden'){dropPetal()}else toast('將花瓣放進花庭右側的水面')};item.addEventListener('pointerup',endDrag);item.addEventListener('pointercancel',()=>{if(drag){drag.ghost.remove();drag=null;$('dropTarget').classList.remove('ready')}});
$('moveBtn').addEventListener('click',()=>go(s.scene==='gate'?'garden':'gate'));$('journalBtn').addEventListener('click',showJournal);$('hintBtn').addEventListener('click',showHint);$('bagBtn').addEventListener('click',showBag);$('menuBtn').addEventListener('click',showMenu);$('audioToggle').addEventListener('click',toggleAudio);$('voiceToggle').addEventListener('click',toggleVoice);$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&modalType!=='start')closeModal()});$('importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||obj.ver!==3||!['gate','garden'].includes(obj.scene)||!Number.isInteger(obj.flower)||obj.flower<0||obj.flower>2)throw Error('不相容存檔');s=sanitize(obj);save();closeModal();updateHud();updateBg(true);renderSpots();positionWater();toast('存檔已恢復')}catch(err){toast('匯入失敗：'+err.message)}e.target.value=''});window.addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(audioCtx&&audioCtx.state==='running')audioCtx.suspend();if('speechSynthesis' in window)speechSynthesis.cancel();cancelHold();save()}else if(audioOn&&audioCtx){audioCtx.resume()}});
function preload(){Object.values(A).forEach(u=>{const im=new Image();im.decoding='async';im.src=u})}
restore();fit();updateHud();startModal();setTimeout(preload,300);
worldTimer=setInterval(()=>{s.ticks++;updateHud();if(s.ticks%4===0)save()},60000);
</script></body></html>
